[package]
name = "hlwindow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "xwindow's window adapter for HashLink and Ash, loaded as xwindow.hdll"
publish = false

[lib]
# cdylib is the hdll a VM loads as xwindow.hdll; staticlib is what the wasm
# side module is linked from.
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
xwindow-backend = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "7782fe978c232872da1914e7546eaaacce75c4c3" }
xwindow-bindgen = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "7782fe978c232872da1914e7546eaaacce75c4c3" }

[dependencies]
hl_abi = { workspace = true }
hl_xidl = { workspace = true }
# The generated model names Ash's Future carrier by this crate's path.
ash_future_abi = { git = "https://github.com/rayzor-blade/ash.git", rev = "ac80cdb17c9fe82a0e86ab893e9d7304d5319fe6" }
xwindow-core = { git = "https://github.com/rayzor-blade/xwindow.git", rev = "7782fe978c232872da1914e7546eaaacce75c4c3" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
