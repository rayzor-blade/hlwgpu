[package]
name = "hl_xidl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The HashLink carriers x-idl generated bindings take from their adapter"
publish = false

[dependencies]
hl_abi = { workspace = true }
ash_future_abi = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Ash's Future entry points, looked up in the running VM.
libloading = "0.8"

[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
libc = "0.2"
