[package]
name = "hlwgpu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "xgpu's WebGPU adapter for HashLink"
publish = false

[lib]
# cdylib is the `.hdll` a HashLink VM loads; staticlib is what the wasm side
# module is linked from; rlib is what tests link.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Adds Vulkan to a build that would not have it. Windows takes D3D12 by
# default; this is for the separate build that can also use Vulkan, chosen at
# run time with WGPU_BACKEND=vulkan.
vulkan = ["wgpu/vulkan"]

[build-dependencies]
xgpu-backend = { workspace = true }
xgpu-bindgen = { workspace = true }

# The backends each platform uses. wgpu compiles every backend it is given and
# gates only some out by target, so the defaults would build Vulkan into a
# macOS library that never calls it. OpenGL ES is Android's alone. No
# `webgpu`: that is for a wasm32-unknown-unknown build, and ours is wasip1.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "metal",
] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "dx12",
] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan", "gles",
] }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan",
] }

[dependencies]
hl_abi = { workspace = true }
hl_xidl = { workspace = true }
ash_future_abi = { workspace = true }
xgpu-core = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The generated native backend uses these alongside its platform's wgpu.
raw-window-handle = "0.6"
pollster = "0.4"
