[package]
name = "hlwgpu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "xgpu's WebGPU adapter for HashLink"
publish = false

[lib]
# cdylib is the `.hdll` a HashLink VM loads; staticlib is what the wasm side
# module is linked from; rlib is so tests and the future host crate can use
# the same code without building it twice.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Adds Vulkan to a build that would not have it. Windows takes D3D12 by
# default; this is for the separate build that can also use Vulkan, chosen at
# run time with WGPU_BACKEND=vulkan.
vulkan = ["wgpu/vulkan"]

[build-dependencies]
xgpu-backend = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "3c2990a7f87e55f7ffa24cb63d0758cfd5e6c85c" }
xgpu-bindgen = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "3c2990a7f87e55f7ffa24cb63d0758cfd5e6c85c" }

# One backend each, the one the platform actually uses. wgpu will compile
# every backend it is given and only some are gated out by target, so leaving
# the defaults on builds Vulkan into a macOS library that will never call it.
# No `gles`: this library does not offer OpenGL. No `webgpu`: that is for a
# wasm32-unknown-unknown build, and ours is wasip1.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "metal",
] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "dx12",
] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan", "gles",
] }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
wgpu = { version = "30", default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan",
] }

[dependencies]
hl_abi = { workspace = true }
ash_future_abi = { git = "https://github.com/rayzor-blade/ash.git", rev = "ac80cdb17c9fe82a0e86ab893e9d7304d5319fe6" }
xgpu-core = { git = "https://github.com/rayzor-blade/xgpu.git", rev = "3c2990a7f87e55f7ffa24cb63d0758cfd5e6c85c" }
libloading = "0.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The generated native backend uses these alongside its platform's wgpu.
raw-window-handle = "0.6"
pollster = "0.4"
