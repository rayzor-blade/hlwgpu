[package]
name = "hlwgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebGPU for HashLink: the wgpu native library"
publish = false

[lib]
# cdylib is the `.hdll` a HashLink VM loads; staticlib is what the wasm side
# module is linked from; rlib is so tests and the future host crate can use
# the same code without building it twice.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["native"]
# The implementation. Off for the wasm side module, which holds none: a
# wasip1 module has no GPU, so the primitives forward and a host answers.
native = ["dep:wgpu", "dep:pollster", "dep:raw-window-handle"]
# Adds Vulkan to a build that would not have it. Windows takes D3D12 by
# default; this is for the separate build that can also use Vulkan, chosen at
# run time with WGPU_BACKEND=vulkan.
vulkan = ["wgpu/vulkan"]

[build-dependencies]
hl_native_gen = { workspace = true }

# One backend each, the one the platform actually uses. wgpu will compile
# every backend it is given and only some are gated out by target, so leaving
# the defaults on builds Vulkan into a macOS library that will never call it.
# No `gles`: this library does not offer OpenGL. No `webgpu`: that is for a
# wasm32-unknown-unknown build, and ours is wasip1.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "metal",
] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "dx12",
] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan", "gles",
] }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = [
  "std", "parking_lot", "wgsl", "vulkan",
] }

[dependencies]
hl_abi = { workspace = true }
# Must resolve to the same version wgpu uses, or the handles are not its.
raw-window-handle = { version = "0.6", optional = true }
# Adapter enumeration is a future that is already resolved on every native
# backend. In a page it genuinely is not, which is why the API is ticketed
# either way -- see `adapter_request` in wgpu.api.
pollster = { version = "0.4", optional = true }
