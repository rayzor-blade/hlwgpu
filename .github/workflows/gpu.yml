name: gpu

# crates/hlwgpu/test/browser/GpuTest.hx against a real adapter: natively on
# stock HashLink, and in headless Chrome through Ash's page. Hosted runners
# have no GPU, so the adapters are software ones: lavapipe for Vulkan, WARP
# for D3D12, and SwiftShader for the browser's WebGPU.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Ash Future's stock HashLink ABI and Haxe sources.
  ASH_FUTURE_ZIP: https://github.com/rayzor-blade/ash/releases/download/v0.1.1/ash-future-0.1.1.zip

jobs:
  native:
    name: native, ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, backend: vulkan (lavapipe), lib: libhlwgpu.so }
          - { os: windows-2022, backend: d3d12 (WARP), lib: hlwgpu.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpu-${{ matrix.os }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install lavapipe
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      # Only the VM: its optional libraries want SDL and the rest, and cmake
      # looks for those while configuring.
      - name: Build stock HashLink
        shell: bash
        run: |
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git "$RUNNER_TEMP/hashlink"
          cmake -S "$RUNNER_TEMP/hashlink" -B "$RUNNER_TEMP/hashlink/build" -DWITH_VM=ON \
            -DWITH_FMT=OFF -DWITH_HEAPS=OFF -DWITH_OPENAL=OFF -DWITH_SDL=OFF \
            -DWITH_SQLITE=OFF -DWITH_SSL=OFF -DWITH_UI=OFF -DWITH_UV=OFF \
            -DWITH_VIDEO=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/hashlink/build" --config Release --target hl
          hl=$(find "$RUNNER_TEMP/hashlink/build" -type f \( -name hl -o -name hl.exe \) | head -1)
          echo "HL=$hl" >> "$GITHUB_ENV"
          # Where libhl's import library (Windows) and shared library sit.
          lib=$(dirname "$(find "$RUNNER_TEMP/hashlink/build" -type f \( -name 'libhl.lib' -o -name 'libhl.so' \) | head -1)")
          echo "HL_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "hl at $hl, libhl in $lib"

      - name: Build xgpu.hdll
        shell: bash
        run: cargo build -p hlwgpu

      - name: Fetch ash-future
        shell: bash
        run: |
          curl -fsSL "$ASH_FUTURE_ZIP" -o "$RUNNER_TEMP/ash-future.zip"
          mkdir -p "$RUNNER_TEMP/ash-future"
          unzip -q "$RUNNER_TEMP/ash-future.zip" -d "$RUNNER_TEMP/ash-future"

      - name: GpuTest on stock HashLink
        shell: bash
        env:
          GPU_TEST_WITHOUT_ADAPTER: skip
        run: scripts/native_test.sh "target/debug/${{ matrix.lib }}" "$RUNNER_TEMP/ash-future"

  browser:
    name: browser, WebGPU (SwiftShader)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A side module is position-independent and the shipped core and std are
      # not, so they are rebuilt. That needs nightly and rust-src.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1-threads
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpu-browser
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ash's nightly: the page that loads side modules is newer than its
      # versioned releases.
      - name: Fetch Ash and ash-future
        run: |
          mkdir -p "$RUNNER_TEMP/ash" "$RUNNER_TEMP/ash-future"
          curl -fsSL https://github.com/rayzor-blade/ash/releases/download/nightly/ash-linux-x86_64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/ash"
          curl -fsSL "$ASH_FUTURE_ZIP" -o "$RUNNER_TEMP/ash-future.zip"
          unzip -q "$RUNNER_TEMP/ash-future.zip" -d "$RUNNER_TEMP/ash-future"

      - name: GpuTest in headless Chrome
        run: |
          ASH="$RUNNER_TEMP/ash/ash" ASH_FUTURE="$RUNNER_TEMP/ash-future" \
          CHROME="$(command -v google-chrome)" \
          CHROME_FLAGS="--enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --use-angle=swiftshader" \
            scripts/browser_test.sh

      - name: Logs
        if: failure()
        run: tail -n 100 target/browser-test/*.log || true
