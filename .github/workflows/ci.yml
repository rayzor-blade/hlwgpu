name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      # winit reaches X11 and Wayland through these.
      - name: Install the windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The wasm side of the library holds no implementation, so nothing above
      # compiles it. A mistake in the forwarding shim only shows here.
      - name: Clippy, wasm
        run: cargo clippy -p hlwgpu --target wasm32-wasip1 --no-default-features -- -D warnings

      # `build.rs` writes xgpu's generated Haxe externs into the tree. They
      # are committed because application developers do not build the Rust
      # generator. A diff means the xgpu pin and public package have drifted.
      - name: The generated files are the ones committed
        run: |
          cargo build --workspace
          git diff --exit-code || {
            echo "::error::a build changed committed files; commit what build.rs wrote"
            exit 1
          }

  haxe:
    name: generated API and typed shaders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Generated GPU API type-checks
        run: haxe -hl /tmp/gpu-api.hl -cp haxe -cp crates/hlwgpu/test -main GpuApi

      - name: HXSL generates WGSL and layouts
        run: haxe --interp -cp haxe -cp crates/hlwgpu/test -main Hxsl
