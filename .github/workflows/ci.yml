name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      # winit reaches X11 and Wayland through these.
      - name: Install the windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev

      - name: The xgpu crates share one pinned revision
        run: python3 scripts/release_check.py pins

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The wasm side of the library holds no implementation, so nothing above
      # compiles it. A mistake in the forwarding shim only shows here.
      - name: Clippy, wasm
        run: cargo clippy -p hlwgpu --target wasm32-wasip1 -- -D warnings

      # `build.rs` writes xgpu's generated Haxe externs into the tree. They
      # are committed because application developers do not build the Rust
      # generator. A diff means the xgpu pin and public package have drifted.
      - name: The generated files are the ones committed
        run: |
          cargo build --workspace
          git diff --exit-code || {
            echo "::error::a build changed committed files; commit what build.rs wrote"
            exit 1
          }

  haxe:
    name: generated API and typed shaders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Generated GPU API type-checks
        run: haxe -hl /tmp/gpu-api.hl -cp haxe -cp crates/hlwgpu/test -main GpuApi

      # Through haxelib, as a program would: crates/hlwgpu/test/framework is a
      # framework's haxelib whose extraParams.hxml registers its extension.
      - name: HXSL generates WGSL and layouts, with a framework's extension
        run: |
          haxelib newrepo
          curl -fsSLO https://github.com/rayzor-blade/ash/releases/download/v0.1.1/ash-future-0.1.1.zip
          haxelib install ash-future-0.1.1.zip
          haxelib dev hlwgpu .
          haxelib dev hxsl-framework crates/hlwgpu/test/framework
          HXSL_WGSL_DIR=wgsl haxe --interp -lib hxsl-framework -cp crates/hlwgpu/test -main Hxsl

      # The naga wgpu validates with, from Cargo.lock.
      - name: Install naga
        run: |
          version=$(sed -n '/^name = "naga"$/{n;s/version = "\(.*\)"/\1/p;}' Cargo.lock)
          cargo install naga-cli --version "$version" --locked

      - name: The WGSL validates
        run: for f in wgsl/*.wgsl; do naga "$f"; done
