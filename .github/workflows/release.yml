name: release

# A v* tag publishes directly. A manual run validates by default and publishes
# only when given an explicit release tag.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create and publish, for example v2026.09.29; leave empty to validate only'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 macOS is cross-compiled from an arm64 runner: the Intel
          # runners are retired, and a job asking for one waits for ever.
          - { os: macos-latest,     name: macos-arm64, target: aarch64-apple-darwin,      built: lib, ext: dylib }
          - { os: macos-latest,     name: macos-x64,   target: x86_64-apple-darwin,       built: lib, ext: dylib }
          - { os: ubuntu-24.04,     name: linux-x64,   target: x86_64-unknown-linux-gnu,  built: lib, ext: so }
          - { os: ubuntu-24.04-arm, name: linux-arm64, target: aarch64-unknown-linux-gnu, built: lib, ext: so }
          - { os: windows-2022,     name: windows-x64, target: x86_64-pc-windows-msvc,    built: "",  ext: dll }
          # D3D12 is what Windows takes by default. This one carries Vulkan
          # as well, chosen with WGPU_BACKEND=vulkan.
          - { os: windows-2022,     name: windows-x64-vulkan, target: x86_64-pc-windows-msvc, built: "", ext: dll, features: vulkan }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Install the windowing headers
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev

      # MSVC will not leave a symbol undefined in a DLL, so xgpu.hdll has to
      # be linked against the VM's import library. Only the VM is built; its
      # optional libraries want SDL and the rest, and cmake looks for those
      # while configuring.
      - name: Build HashLink for its import library
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          cmake -S /tmp/hashlink -B /tmp/hashlink/build -DWITH_VM=ON \
            -DWITH_FMT=OFF -DWITH_HEAPS=OFF -DWITH_OPENAL=OFF -DWITH_SDL=OFF \
            -DWITH_SQLITE=OFF -DWITH_SSL=OFF -DWITH_UI=OFF -DWITH_UV=OFF \
            -DWITH_VIDEO=OFF
          cmake --build /tmp/hashlink/build --config Release --target libhl
          libdir=$(dirname "$(find /tmp/hashlink/build -name 'libhl.lib' | head -1)")
          echo "found libhl.lib in $libdir"
          echo "HL_LIB_DIR=$libdir" >> "$GITHUB_ENV"

      # bash on every platform: the runner's default on Windows is PowerShell,
      # which does not read a trailing backslash as a continuation.
      - name: Build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p hlwgpu \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Name them as HashLink expects
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.built }}hlwgpu.${{ matrix.ext }}" out/xgpu.hdll
          cp -r haxe out/
          cp haxelib.json out/
          cp LICENSE README.md out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hlwgpu-hdll-${{ matrix.name }}
          path: out/

  mobile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  name: ios-arm64,     target: aarch64-apple-ios }
          - { os: macos-latest,  name: ios-simulator, target: aarch64-apple-ios-sim }
          - { os: ubuntu-24.04,  name: android-arm64, target: aarch64-linux-android }
          - { os: ubuntu-24.04,  name: android-arm,   target: armv7-linux-androideabi }
          - { os: ubuntu-24.04,  name: android-x64,   target: x86_64-linux-android }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - uses: nttld/setup-ndk@v1
        if: startsWith(matrix.name, 'android')
        with:
          ndk-version: r27

      - name: Install cargo-ndk
        if: startsWith(matrix.name, 'android')
        run: cargo install cargo-ndk --locked

      # A mobile app links HashLink and its libraries statically, so what
      # ships here is the archive rather than a loadable hdll. It is large
      # because an archive holds every object file; the app's linker keeps
      # only what it reaches.
      - name: Build
        run: |
          if [ "${{ startsWith(matrix.name, 'android') }}" = "true" ]; then
            cargo ndk -t ${{ matrix.target }} build --release -p hlwgpu
          else
            cargo build --release -p hlwgpu --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/libhlwgpu.a" out/
          cp LICENSE README.md out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hlwgpu-${{ matrix.name }}
          path: out/

  wasm:
    name: wasm side module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A side module is position-independent and the shipped core and std are
      # not, so they are rebuilt. That needs nightly and rust-src.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1-threads
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm

      - name: Build
        run: scripts/build_wasm.sh "$PWD/out"

      # Nothing inside the module calls a primitive: the program does, by
      # name, after loading it. If one is missing, it is missing quietly.
      - name: Every primitive is exported
        run: |
          missing=0
          for p in $(sed -n 's/.*@:hlNative("xgpu", "\([^"]*\)").*/hlp_\1/p' haxe/gpu/*.hx | sort -u); do
            strings out/xgpu.wasm | grep -q "$p" || { echo "::error::$p is not exported"; missing=1; }
          done
          exit $missing

      - name: Check and collect
        run: |
          node --check out/gpu.mjs
          node --check out/gpu-worker.mjs
          node --check out/gpu-agent.mjs
          node --check out/hlwgpu.js
          cp -r haxe out/
          cp haxelib.json LICENSE README.md crates/hlwgpu/IMPORTS.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: hlwgpu-wasm-ash
          path: out/

  haxe:
    name: haxe sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          mkdir -p out
          cp -r haxe out/
          cp haxelib.json LICENSE README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: hlwgpu-haxe
          path: out/

  publish:
    name: publish
    needs: [native, mobile, wasm, haxe]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0

      - name: Point the nightly tag at this build
        if: github.event_name == 'schedule'
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: One archive per thing
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release/$name.zip" .)
          done
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'schedule' && 'nightly' || inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*.zip
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'schedule' }}
          make_latest: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
